name: Smoke run (SYNTHETIC)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke run (seed 42, SYNTHETIC)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install optional dependency (tqdm)
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run the toy simulation twice with a fixed seed
        run: |
          set -euo pipefail
          for i in 1 2; do
            python oes32_v14_improved.py --iterations 20000 --erasure 0.15 --seed 42 2>"run$i.log" \
              | grep -v '^Timestamp' > "run$i.txt"
          done
          cat run1.txt
      - name: Assert output is tagged SYNTHETIC and reproducible
        run: |
          set -euo pipefail
          grep -q '\[METRIC_TAG=SYNTHETIC\]' run1.txt || { echo "::error::report header is not tagged METRIC_TAG=SYNTHETIC"; exit 1; }
          grep -q 'All values above are outputs of hand-written formulas (METRIC_TAG=SYNTHETIC)' run1.txt || { echo "::error::report footer is not tagged SYNTHETIC"; exit 1; }
          grep -q 'Success Rate .*\[SYNTHETIC' run1.txt || { echo "::error::success-rate line is not tagged SYNTHETIC"; exit 1; }
          if grep -Eiq 'investor|STABLE ✅' run1.txt; then echo "::error::removed framing reappeared"; exit 1; fi
          diff run1.txt run2.txt || { echo "::error::seeded runs differ"; exit 1; }
          echo "OK: SYNTHETIC tags present and seeded output reproducible."
